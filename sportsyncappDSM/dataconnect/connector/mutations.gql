# Crea el registro en la tabla Usuarios para el usuario que acaba de
# registrarse en Firebase Authentication.
#
# id_expr: "auth.uid" hace que Data Connect use automaticamente el uid
# del usuario autenticado como llave primaria (coincide con el
# @default(expr: "auth.uid") del schema).
#
# rolId espera el UUID de la fila en Roles (el que ya insertaste a mano
# para "Usuario").

mutation CreateUsuario(
  $nombre: String!
  $apellido: String!
  $correo: String!
  $fechaNacimiento: Date!
  $rolId: UUID @retired(reason: "El rol se asigna automáticamente")
  $fotoPerfil: String
) @auth(level: USER) {
  usuarios_insert(data: {
    id_expr: "auth.uid"
    nombre: $nombre
    apellido: $apellido
    correo: $correo
    fechaNacimiento: $fechaNacimiento
    rolId: "550e8400e29b41d4a716446655440001"
    fotoPerfil: $fotoPerfil
  })
}


# Crear un deporte: solo Administrador
mutation CreateDeporte(
  $nombreDeporte: String!
) @auth(level: USER) @transaction {
  query @redact {
    usuarios(id_expr: "auth.uid") {
      rol {
        nombreRol @check(
          expr: "this == 'Administrador'"
          message: "Solo un administrador puede crear deportes."
        )
      }
    }
  }

  deportes_insert(data: {
    nombreDeporte: $nombreDeporte
  })
}

# Actualizar un deporte: solo Administrador
mutation UpdateDeporte(
  $id: UUID!
  $nombreDeporte: String!
) @auth(level: USER) @transaction {
  query @redact {
    usuarios(id_expr: "auth.uid") {
      rol {
        nombreRol @check(
          expr: "this == 'Administrador'"
          message: "Solo un administrador puede editar deportes."
        )
      }
    }
  }

  deportes_update(
    key: { id: $id }
    data: {
      nombreDeporte: $nombreDeporte
    }
  )
}

# Eliminar un deporte: solo Administrador
mutation DeleteDeporte(
  $id: UUID!
) @auth(level: USER) @transaction {
  query @redact {
    usuarios(id_expr: "auth.uid") {
      rol {
        nombreRol @check(
          expr: "this == 'Administrador'"
