# Actualizar los datos personales del usuario autenticado.
# El usuario solo puede modificar su propio registro.
# No permite cambiar el correo, rol, UID ni foto de perfil.

mutation UpdateUsuario(
  $nombre: String!
  $apellido: String!
  $fechaNacimiento: Date!
) @auth(level: USER) {
  usuarios_update(
    key: { id_expr: "auth.uid" }
    data: {
      nombre: $nombre
      apellido: $apellido
      fechaNacimiento: $fechaNacimiento
    }
  )
}


