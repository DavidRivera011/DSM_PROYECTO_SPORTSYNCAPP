# Obtener todos los partidos con sus relaciones.
query GetPartidos @auth(level: USER) {
  partidoss(limit: 100) {
    id
    evento {
      id
      nombre
      fecha
    }
    deporte {
      id
      nombreDeporte
    }
    equipoLocal {
      id
      nombreEquipo
    }
    equipoVisitante {
      id
      nombreEquipo
    }
    marcadorLocal
    marcadorVisitante
    fecha
    hora
    estado {
      id
      nombreEstado
    }
  }
}

# Obtener un partido específico por ID.
query GetPartidoPorId($id: UUID!) @auth(level: USER) {
  partidoss(
    where: { id: { eq: $id } }
    limit: 1
  ) {
    id
    evento {
      id
      nombre
      fecha
    }
    deporte {
      id
      nombreDeporte
    }
    equipoLocal {
      id
      nombreEquipo
    }
    equipoVisitante {
      id
      nombreEquipo
    }
    marcadorLocal
    marcadorVisitante
    fecha
    hora
    estado {
      id
      nombreEstado
    }
  }
}

